name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Tests run on MySQL (not SQLite) because the schema relies on MySQL features:
    # triggers for immutable records and foreign keys into the kmu-cms database.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: kmu_assess
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Create testing database
        run: mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS kmu_assess_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The v_cms_* views read the kmu-cms database, which lives in another repository. CI uses an
      # empty copy of its structure so migrations can create the views.
      - name: Create stand-in kmu-cms database
        run: |
          mysql -h 127.0.0.1 -uroot -e 'CREATE DATABASE IF NOT EXISTS `kmu-cms` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mysql -h 127.0.0.1 -uroot kmu-cms < tests/Fixtures/cms_schema.sql

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
